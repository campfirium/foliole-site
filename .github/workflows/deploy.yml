name: Deploy site

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [foliole-release-published]
  workflow_dispatch:
    inputs:
      directory_url:
        description: Optional verified Foliole platform download directory URL
        required: false
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAGES: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Update published download manifest
        if: github.event_name == 'repository_dispatch' || (github.event_name == 'workflow_dispatch' && inputs.directory_url != '')
        env:
          DIRECTORY_URL: ${{ github.event.client_payload.directory_url || inputs.directory_url }}
        run: |
          node scripts/update-downloads-manifest.mjs --directory-url "$DIRECTORY_URL"
      - name: Commit published download manifest
        if: github.event_name == 'repository_dispatch' || (github.event_name == 'workflow_dispatch' && inputs.directory_url != '')
        run: |
          if git diff --quiet -- content/downloads.json; then
            echo "Download manifest is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/downloads.json
          product_version="$(node -p "require('./content/downloads.json').productVersion")"
          git commit -m "chore: update platform downloads for ${product_version}"
          git push origin HEAD:main
      - name: Install dependencies
        run: npm ci
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Build
        run: npm run build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
